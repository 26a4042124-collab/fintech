{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block body %}
<div class="auth-wrapper">
  <div class="blob blob-orange"></div>
  <div class="blob blob-orange-2"></div>

  <div class="status-bar">
    <span>12:00</span>
    <div class="status-bar-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <div class="auth-header">
    <a href="{{ url_for('landing') }}" class="auth-back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="auth-brand">
      <div class="auth-brand-icon">🪙</div>
      <div class="auth-brand-name">finlab</div>
    </div>
    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-subtitle">Nhập số điện thoại để bắt đầu.<br>Chúng tôi sẽ gửi mã xác thực.</p>
  </div>

  <div class="auth-body">
    {% if error %}
    <div class="form-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label">Số điện thoại</label>
        <div class="input-wrapper">
          <span class="input-prefix">🇻🇳 +84</span>
          <input type="tel" name="phone" class="form-input"
            placeholder="0xxx xxx xxx"
            value="{{ phone or '' }}"
            maxlength="11" required
            style="padding-left: 72px;">
        </div>
      </div>
      <div class="mt-8"></div>
      <button type="submit" class="btn-primary">
        Gửi mã OTP <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <div class="auth-footer">
    Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập ngay</a>
  </div>
</div>
{% endblock %}
