<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Đăng nhập - FinLab | AI Financial Assistant &amp; Open Banking</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .demo-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 1.25rem;
        }
        .btn-quick-admin {
            width: 100%;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #e0e7ff;
            border: 1px solid #4338ca;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-quick-admin:hover {
            background: linear-gradient(135deg, #312e81, #4338ca);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h1 class="login-title">FinLab</h1>
            <p class="login-subtitle">Trợ lý Quản lý Tài chính Thông minh &amp; Open Banking Prototype</p>
        </div>

        {% if error %}
        <div class="alert-danger" style="margin-bottom: 1.25rem; padding: 0.75rem 1rem; border-radius: 8px; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fa-solid fa-user" style="color: #64748b; margin-right: 4px;"></i> Tên đăng nhập
                </label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập..." required value="{{ username or 'nguyen_van_a' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fa-solid fa-lock" style="color: #64748b; margin-right: 4px;"></i> Mật khẩu
                </label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required value="{{ 'password123' if not error else '' }}">
            </div>

            <button type="submit" class="btn-login">
                Đăng nhập hệ thống <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
            </button>
        </form>

        <div class="demo-buttons-group">
            <button type="button" class="btn-quick-demo" id="btn-quick-demo">
                <i class="fa-solid fa-bolt" style="color: #f59e0b;"></i>
                Đăng nhập User: <strong>Nguyễn Văn A</strong> (Demo PFM)
            </button>
            <button type="button" class="btn-quick-admin" id="btn-quick-admin">
                <i class="fa-solid fa-shield-halved" style="color: #a5b4fc;"></i>
                Đăng nhập Admin: <strong>Quản trị FinLab</strong> (Trang Admin)
            </button>
        </div>

        <div class="login-footer">
            <p>Học viện Ngân hàng - Khoa CNTT &amp; Kinh tế số</p>
            <p>Đồ án môn <strong>Công nghệ dịch vụ tài chính</strong> &copy; 2026</p>
        </div>
    </div>

    <script>
        document.getElementById('btn-quick-demo').addEventListener('click', function() {
            document.getElementById('username').value = 'nguyen_van_a';
            document.getElementById('password').value = 'password123';
            document.getElementById('login-form').submit();
        });

        document.getElementById('btn-quick-admin').addEventListener('click', function() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            document.getElementById('login-form').submit();
        });
    </script>
</body>
</html>
