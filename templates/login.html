<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Đăng nhập - FinLab | AI Financial Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h1 class="login-title">FinLab</h1>
            <p class="login-subtitle">Trợ lý Quản lý Tài chính & Cảnh báo Rò rỉ Chi tiêu (AI & Open Banking)</p>
        </div>

        {% if error %}
        <div class="alert-danger">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fa-solid fa-user" style="color: #64748b; margin-right: 4px;"></i> Tên đăng nhập
                </label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập..." required value="{{ username or 'nguyen_van_a' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fa-solid fa-lock" style="color: #64748b; margin-right: 4px;"></i> Mật khẩu
                </label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required value="{{ 'password123' if not error else '' }}">
            </div>

            <button type="submit" class="btn-login">
                Đăng nhập hệ thống <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
            </button>
        </form>

        <button type="button" class="btn-quick-demo" id="btn-quick-demo">
            <i class="fa-solid fa-bolt" style="color: #f59e0b;"></i>
            Đăng nhập nhanh: <strong>Nguyễn Văn A</strong> (Demo 1 chạm)
        </button>

        <div class="login-footer">
            <p>Học viện Ngân hàng - Khoa CNTT &amp; Kinh tế số</p>
            <p>Đồ án môn <strong>Công nghệ dịch vụ tài chính</strong> &copy; 2026</p>
        </div>
    </div>

    <script>
        document.getElementById('btn-quick-demo').addEventListener('click', function() {
            document.getElementById('username').value = 'nguyen_van_a';
            document.getElementById('password').value = 'password123';
            document.getElementById('login-form').submit();
        });
    </script>
</body>
</html>
